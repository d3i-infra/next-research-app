<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {%- if page.noindex %}
  <meta name="robots" content="noindex">
  {%- endif %}
  {% seo %}
  <link rel="preload" href="{{ '/assets/fonts/newsreader-latin-opsz-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ '/assets/fonts/libre-franklin-latin-wght-normal.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
  {%- comment -%} ?v= busts browser caches on every build. {%- endcomment %}
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
</head>
<body class="layout-{{ page.layout }}">
  <a class="skip-link" href="#main">Skip to content</a>
  {% include header.html %}
  <main id="main" class="site-main">
    <div class="container">
      {{ content }}
    </div>
  </main>
  {% include footer.html %}
</body>
</html>
