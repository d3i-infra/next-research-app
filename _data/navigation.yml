  - { key: about, title: "About", url: "/about/" }
  - { key: why, title: "Why our app?", url: "/why-our-app/" }
  - { key: contact, title: "Contact Us", url: "/contact/" }

footer:
  - { title: "About", url: "/about/" }
  - { title: "Funding Bodies", url: "/about/funding-bodies/" }
  - { title: "Team", url: "/about/team/" }
