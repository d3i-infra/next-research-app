# Developer-owned (not in the CMS): URL changes need matching permalinks.
# `key` matches a page's `nav_key` front matter to mark the active item;
# subpages (Funding Bodies, Team) carry the key of their section.
#
# Under construction, add back when their pages exist:
#   - { key: news, title: "News & Events", url: "/news/" }   (between About and Why our app?)
#   - Privacy policy in the footer
main:
