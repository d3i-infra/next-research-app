<header class="site-header">
  <div class="site-header__inner container">
    <a class="site-logo" href="{{ '/' | relative_url }}">
      {%- if site.data.settings.logo and site.data.settings.logo != "" -%}
        <img class="site-logo__image" src="{{ site.data.settings.logo | relative_url }}" alt="{{ site.data.settings.site_name }}">
      {%- else -%}
        <span class="site-logo__text">{{ site.data.settings.site_name }}</span>
      {%- endif -%}
    </a>
    <nav class="site-nav" aria-label="Main">
      <ul class="site-nav__list">
        {%- for item in site.data.navigation.main %}
        <li class="site-nav__item">
          <a class="site-nav__link{% if page.nav_key == item.key %} is-active{% endif %}" href="{{ item.url | relative_url }}"{% if page.nav_key == item.key %} aria-current="page"{% endif %}>{{ item.title }}</a>
        </li>
        {%- endfor %}
      </ul>
    </nav>
  </div>
</header>
