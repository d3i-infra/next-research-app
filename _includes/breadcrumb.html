{%- if page.parent -%}
<nav class="breadcrumb" aria-label="Breadcrumb">
  <ol class="breadcrumb__list">
    <li class="breadcrumb__item"><a class="breadcrumb__link" href="{{ page.parent.url | relative_url }}">{{ page.parent.title }}</a></li>
    <li class="breadcrumb__item" aria-current="page">{{ page.title }}</li>
  </ol>
</nav>
{%- endif -%}
