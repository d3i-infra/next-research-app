name: Deploy to Netlify (production)

# Manual promote: main HEAD → production, gated by the `production`
# environment's required reviewer (set up under Settings → Environments).
# This is the only path that ships to the live site.
#
# Netlify Forms: the contact form is detected by Netlify when it
# post-processes this deploy. Enable "Form detection" once in the Netlify
# site settings (Forms) or submissions are not collected.

on:
  workflow_dispatch:

concurrency:
  group: "deploy-production"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      # TODO: set to the production URL.
      url: https://example.org
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './_site'
          production-deploy: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Manual deploy - ${{ github.sha }}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
